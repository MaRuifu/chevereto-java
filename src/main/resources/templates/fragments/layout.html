<!DOCTYPE html>
<html lang="zh-CN" xmlns:th="http://www.thymeleaf.org">
<head th:fragment="head(title)">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title th:text="${title} + ' - ' + ${siteName}">Java 图床</title>
    <link rel="icon" type="image/png" th:href="@{/assets/favicon.png}">
    <link rel="stylesheet" th:href="@{/vendor/fontawesome/css/all.min.css}">
    <link rel="stylesheet" th:href="@{/css/app.css}">
</head>
<body>

<!-- Peafowl 风格顶栏 -->
<header th:fragment="topbar" class="topbar">
    <div class="topbar-inner">
        <a class="topbar-logo" th:href="@{/}">
            <i class="fa-solid fa-camera-retro"></i>
            <span th:text="${siteName}">Java 图床</span>
        </a>
        <nav class="topbar-menu">
            <a th:href="@{/}" class="menu-item"><i class="fa-solid fa-cloud-arrow-up"></i> 上传</a>
            <a th:href="@{/explore}" class="menu-item"><i class="fa-solid fa-compass"></i> 探索</a>
        </nav>
        <form class="topbar-search" th:action="@{/search}" method="get">
            <input type="text" name="q" placeholder="搜索图片..." autocomplete="off">
            <button type="submit"><i class="fa-solid fa-magnifying-glass"></i></button>
        </form>
        <div class="topbar-user">
            <th:block th:if="${me == null}">
                <a class="btn-topbar" th:href="@{/login}"><i class="fa-solid fa-right-to-bracket"></i> 登录</a>
                <a class="btn-topbar btn-accent" th:href="@{/login}"><i class="fa-solid fa-user-plus"></i> 注册</a>
            </th:block>
            <th:block th:if="${me != null}">
                <a class="btn-topbar btn-accent" th:href="@{/}"><i class="fa-solid fa-cloud-arrow-up"></i> 上传图片</a>
                <div class="user-dropdown">
                    <button class="user-trigger">
                        <span class="user-avatar"><i class="fa-solid fa-user-circle"></i></span>
                        <span th:text="${me.userUsername}"></span>
                        <i class="fa-solid fa-chevron-down"></i>
                    </button>
                    <div class="user-menu">
                        <a th:href="@{'/u/' + ${me.userUsername}}"><i class="fa-solid fa-images"></i> 我的图片</a>
                        <a th:href="@{/settings}"><i class="fa-solid fa-gear"></i> 设置</a>
                        <a th:if="${me.userIsAdmin}" th:href="@{/admin}"><i class="fa-solid fa-gauge-high"></i> 管理后台</a>
                        <form th:action="@{/logout}" method="post">
                            <button type="submit"><i class="fa-solid fa-right-from-bracket"></i> 退出</button>
                        </form>
                    </div>
                </div>
            </th:block>
        </div>
    </div>
</header>

<main th:fragment="flash">
    <div class="container" th:if="${success != null or error != null}">
        <div class="alert alert-success" th:if="${success != null}"><i class="fa-solid fa-circle-check"></i> <span th:text="${success}"></span></div>
        <div class="alert alert-error" th:if="${error != null}"><i class="fa-solid fa-circle-exclamation"></i> <span th:text="${error}"></span></div>
    </div>
</main>

<footer th:fragment="footer" class="footer">
    <div class="container">
        <span th:text="${siteName}"></span> · Powered by <strong>chevereto-java</strong>
    </div>
</footer>

<script th:fragment="scripts" th:src="@{/js/app.js}"></script>
</body>
</html>
