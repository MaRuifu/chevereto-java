<!DOCTYPE html>
<html lang="zh-CN" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head('密码保护专辑')}"></head>
<body>
<header th:replace="~{fragments/layout :: topbar}"></header>

<section class="container auth-page">
    <div class="card auth-card center">
        <p class="big-icon"><i class="fa-solid fa-key"></i></p>
        <h1 th:text="'专辑「' + ${album.albumName} + '」受密码保护'"></h1>
        <form method="post" class="stack-form narrow">
            <input type="password" name="password" placeholder="输入专辑密码" required autofocus>
            <button class="btn btn-accent btn-block" type="submit">查看专辑</button>
        </form>
    </div>
</section>

<footer th:replace="~{fragments/layout :: footer}"></footer>
</body>
</html>
